spring.application.name=ford-competitive-api

# DATABASE
spring.datasource.url=jdbc:postgresql://localhost:5432/ford_challenge
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:123456}

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SERVER
server.port=8080
server.address=0.0.0.0

# JWT
# Em produção, defina JWT_SECRET como variável de ambiente (nunca versione o segredo real).
jwt.secret=${JWT_SECRET:ford-challenge-secret-key-super-segura-para-jwt-2026-troque-em-producao}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
