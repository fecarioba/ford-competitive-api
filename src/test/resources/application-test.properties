# Perfil usado exclusivamente pelos testes automatizados (ver @ActiveProfiles("test")).
spring.datasource.url=jdbc:h2:mem:ford_challenge_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

jwt.secret=test-secret-key-apenas-para-execucao-dos-testes-automatizados
jwt.expiration-ms=3600000
