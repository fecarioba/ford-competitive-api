spring.application.name=ford-competitive-api

# DATABASE
spring.datasource.url=jdbc:postgresql://localhost:5432/ford_challenge
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# SERVER
server.port=8080
server.address=0.0.0.0

# JWT
# Em produção, defina JWT_SECRET como variável de ambiente (nunca versione o segredo real).
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Origens web autorizadas, separadas por virgula. Clientes mobile nativos nao usam CORS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081}
